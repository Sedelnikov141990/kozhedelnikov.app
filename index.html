    function getColorHex(colorName) {
      const lower = colorName.toLowerCase();
      if (lower.includes('черн') && lower.includes('красн')) return 'linear-gradient(135deg, #1a1a1a 50%, #8b0000 50%)';
      if (lower.includes('black') && lower.includes('red')) return 'linear-gradient(135deg, #1a1a1a 50%, #8b0000 50%)';
      if (lower.includes('preto') && lower.includes('vermelho')) return 'linear-gradient(135deg, #1a1a1a 50%, #8b0000 50%)';
      
      if (lower.includes('черн') || lower.includes('чёрн') || lower.includes('black') || lower.includes('preto')) return '#1a1a1a';
      if (lower.includes('шоколад') || lower.includes('темно') || lower.includes('коричн') || lower.includes('brown') || lower.includes('marrom')) return '#3d2314';
      if (lower.includes('рыж') || lower.includes('коньяк') || lower.includes('cognac') || lower.includes('conhaque')) return '#a65b24';
      if (lower.includes('бордо') || lower.includes('вишн') || lower.includes('burgundy') || lower.includes('vinho')) return '#58111a';
      if (lower.includes('красн') || lower.includes('red') || lower.includes('vermelho')) return '#8b0000';
      if (lower.includes('зелен') || lower.includes('изумруд') || lower.includes('green') || lower.includes('verde')) return '#1b382b';
      if (lower.includes('син') || lower.includes('navy') || lower.includes('blue') || lower.includes('azul')) return '#1a2b4c';
      if (lower.includes('желт') || lower.includes('жёлт') || lower.includes('горчиц') || lower.includes('yellow') || lower.includes('amarelo')) return '#c28b1e';
      if (lower.includes('оливк') || lower.includes('olive') || lower.includes('oliva')) return '#556b2f';
      return '#8b5a2b';
    }

    async function fetchExchangeRates() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/RUB');
        const data = await res.json();
        if (data && data.rates) {
          exchangeRates.USD = data.rates.USD || 0.011;
          exchangeRates.BRL = data.rates.BRL || 0.058;
        }
      } catch (e) {
        console.warn('Using default exchange rates due to network/API');
      }
    }

    function formatPrice(rubPrice) {

      if (currentCurrency === 'BRL') return `R$ ${Math.round(rubPrice * exchangeRates.BRL)}`;
      return `${rubPrice.toLocaleString('ru-RU')} ₽`;

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      if (!grid) return;
      grid.innerHTML = '';

      const filtered = products.filter(p => currentCategory === 'all' || p.category === currentCategory);

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const name = p.name[currentCountry] || p.name.RU;
        const desc = p.desc[currentCountry] || p.desc.RU;
        const mainVariant = p.colorVariants[0];
        const previewImg = mainVariant && mainVariant.images ? mainVariant.images[0] : '';

        let swatchesHtml = '';
        p.colorVariants.forEach((v, idx) => {
          const colorTitle = v.color[currentCountry] || v.color.RU;
          const bg = getColorHex(colorTitle);
          swatchesHtml += `<span class="color-dot ${idx === 0 ? 'active' : ''}" style="background: ${bg};" title="${colorTitle}" data-idx="${idx}"></span>`;
        });

        card.innerHTML = `
          <img src="${previewImg}" class="product-img" alt="${name}" loading="lazy">
          <div class="product-info">
            <div class="product-category-tag">${p.category}</div>
            <div class="product-title">${name}</div>
            <div class="product-desc">${desc}</div>
            <div class="color-swatches">${swatchesHtml}</div>
            <div class="product-price">${formatPrice(p.price)}</div>
            <button class="add-btn">${I18N[currentCountry].chooseBtn}</button>
          </div>
        `;

        const imgEl = card.querySelector('.product-img');
        const dots = card.querySelectorAll('.color-dot');

        dots.forEach(dot => {
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            dots.forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            const idx = parseInt(dot.getAttribute('data-idx'), 10);
            if (p.colorVariants[idx] && p.colorVariants[idx].images[0]) {
              imgEl.src = p.colorVariants[idx].images[0];
            }
          });
        });

        const openDetails = () => openProductModal(p);
        imgEl.addEventListener('click', openDetails);
        card.querySelector('.product-title').addEventListener('click', openDetails);
        card.querySelector('.add-btn').addEventListener('click', openDetails);

        grid.appendChild(card);
      });
    }

    function openProductModal(product) {
      activeDetailProduct = product;
      activeDetailColorIndex = 0;
      activeDetailImageIndex = 0;

      const modal = document.getElementById('product-detail-modal');
      const title = product.name[currentCountry] || product.name.RU;
      const desc = product.desc[currentCountry] || product.desc.RU;

      document.getElementById('detail-title').textContent = title;
      document.getElementById('detail-desc').textContent = desc;
      document.getElementById('detail-price').textContent = formatPrice(product.price);

      const engravingCheck = document.getElementById('item-engraving-check');
      engravingCheck.checked = false;
      document.getElementById('item-engraving-group').style.display = 'none';
      document.getElementById('item-engraving-text').value = '';

      renderModalSwatches();
      updateModalGallery();

      modal.classList.add('active');
      trackAnalyticsEvent('view_item', { item_id: product.id, item_name: title });
    }

    function renderModalSwatches() {
      const container = document.getElementById('modal-swatches-container');
      container.innerHTML = '';

      activeDetailProduct.colorVariants.forEach((v, idx) => {
        const colorName = v.color[currentCountry] || v.color.RU;
        const hex = getColorHex(colorName);
        const item = document.createElement('div');
        item.className = `modal-color-item ${idx === activeDetailColorIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span class="modal-color-dot" style="background: ${hex};"></span>
          <span>${colorName}</span>
        `;

        item.addEventListener('click', () => {
          activeDetailColorIndex = idx;
          activeDetailImageIndex = 0;
          renderModalSwatches();
          updateModalGallery();
        });

        container.appendChild(item);
      });

      const activeColorName = activeDetailProduct.colorVariants[activeDetailColorIndex].color[currentCountry] || activeDetailProduct.colorVariants[activeDetailColorIndex].color.RU;
      document.getElementById('modal-selected-color-name').textContent = activeColorName;
    }

    function updateModalGallery() {
      const gallery = document.getElementById('detail-gallery');
      const dotsContainer = document.getElementById('gallery-dots');
      gallery.innerHTML = '';
      dotsContainer.innerHTML = '';

      const images = activeDetailProduct.colorVariants[activeDetailColorIndex].images || [];

      images.forEach((src, idx) => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = activeDetailProduct.name[currentCountry] || activeDetailProduct.name.RU;
        img.loading = 'lazy';
        gallery.appendChild(img);

        const dot = document.createElement('div');
        dot.className = `dot ${idx === 0 ? 'active' : ''}`;
        dotsContainer.appendChild(dot);
      });

      gallery.scrollLeft = 0;

      gallery.onscroll = () => {
        const width = gallery.clientWidth;
        if (width > 0) {
          const newIdx = Math.round(gallery.scrollLeft / width);
          const dots = dotsContainer.querySelectorAll('.dot');
          dots.forEach((d, i) => {
            d.classList.toggle('active', i === newIdx);
          });
        }
      };
    }

    document.getElementById('gallery-prev-btn').addEventListener('click', () => {
      const g = document.getElementById('detail-gallery');
      g.scrollBy({ left: -g.clientWidth, behavior: 'smooth' });
    });
    document.getElementById('gallery-next-btn').addEventListener('click', () => {
      const g = document.getElementById('detail-gallery');
      g.scrollBy({ left: g.clientWidth, behavior: 'smooth' });
    });

    document.getElementById('item-engraving-check').addEventListener('change', (e) => {
      document.getElementById('item-engraving-group').style.display = e.target.checked ? 'block' : 'none';
    });

    document.getElementById('detail-add-btn').addEventListener('click', () => {
      if (!activeDetailProduct) return;

      const variant = activeDetailProduct.colorVariants[activeDetailColorIndex];
      const colorTitle = variant.color[currentCountry] || variant.color.RU;
      const isEngraved = document.getElementById('item-engraving-check').checked;
      const engravingText = isEngraved ? document.getElementById('item-engraving-text').value.trim() : '';

      const itemKey = `${activeDetailProduct.id}_${colorTitle}_${isEngraved ? engravingText : 'none'}`;
      const existing = cart.find(i => i.key === itemKey);

      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          key: itemKey,
          id: activeDetailProduct.id,
          name: activeDetailProduct.name[currentCountry] || activeDetailProduct.name.RU,
          basePrice: activeDetailProduct.price,
          engraving: isEngraved,
          engravingText: engravingText,
          color: colorTitle,
          image: variant.images && variant.images[0] ? variant.images[0] : '',
          qty: 1
        });
      }

      document.getElementById('product-detail-modal').classList.remove('active');
      updateCartUI();
      trackAnalyticsEvent('add_to_cart', { item_id: activeDetailProduct.id });

      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    });

    function updateCartUI() {
      const cartBar = document.getElementById('cart-bar');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');

      const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalSumRub = cart.reduce((acc, item) => {
        const itemPrice = item.basePrice + (item.engraving ? ENGRAVING_PRICE_RUB : 0);
        return acc + itemPrice * item.qty;
      }, 0);

      countEl.textContent = totalQty;
      totalEl.textContent = formatPrice(totalSumRub);

      if (totalQty > 0) {
        cartBar.classList.add('visible');
      } else {
        cartBar.classList.remove('visible');
      }

      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<div class="empty-cart-msg">${I18N[currentCountry].emptyCart}</div>`;
        return;
      }

      cart.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'cart-item';

        const itemPrice = item.basePrice + (item.engraving ? ENGRAVING_PRICE_RUB : 0);
        const optionsStr = `${item.color}${item.engraving ? ` | Грав: "${item.engravingText || 'Да'}"` : ''}`;

        row.innerHTML = `
          <img src="${item.image}" class="cart-item-img" alt="${item.name}">
          <div class="cart-item-details">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-options">${optionsStr}</div>
            <div class="cart-item-price">${formatPrice(itemPrice)}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn btn-minus" data-idx="${index}">-</button>
            <span style="font-size: 13px; font-weight: 600;">${item.qty}</span>
            <button class="qty-btn btn-plus" data-idx="${index}">+</button>
          </div>
        `;

        row.querySelector('.btn-minus').addEventListener('click', () => {
          if (item.qty > 1) {
            item.qty -= 1;
          } else {
            cart.splice(index, 1);
          }
          updateCartUI();
        });

        row.querySelector('.btn-plus').addEventListener('click', () => {
          item.qty += 1;
          updateCartUI();
        });

        container.appendChild(row);
      });
    }

    document.getElementById('cart-bar').addEventListener('click', () => {
      document.getElementById('cart-modal').classList.add('active');
    });

    document.querySelectorAll('.close-btn, .floating-close-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
      });
    });

    document.getElementById('header-about-btn').addEventListener('click', () => {
      document.getElementById('about-modal').classList.add('active');
    });
    document.getElementById('about-return-btn').addEventListener('click', () => {
      document.getElementById('about-modal').classList.remove('active');
    });

    document.getElementById('header-custom-order-btn').addEventListener('click', () => {
      document.getElementById('custom-order-modal').classList.add('active');
    });

    document.getElementById('custom-contact-type').addEventListener('change', (e) => {
      const isTg = e.target.value === 'Telegram';
      const label = document.getElementById('custom-contact-label');
      const input = document.getElementById('custom-contact-value');
      const t = I18N[currentCountry];
      if (isTg) {
        label.textContent = t.customTgNickLabel;
        input.placeholder = '@username';
      } else {
        label.textContent = t.customWaPhoneLabel;
        input.placeholder = '+55 48 9...';
      }
    });

    // Отправка заявки на индивидуальный заказ (один обработчик)
    document.getElementById('custom-submit-btn').addEventListener('click', async () => {
      const t = I18N[currentCountry];
      const itemName = document.getElementById('custom-item-name').value.trim();
      const color = document.getElementById('custom-item-color').value.trim();
      const desc = document.getElementById('custom-item-desc').value.trim();
      const contactType = document.getElementById('custom-contact-type').value;
      const contactVal = document.getElementById('custom-contact-value').value.trim();
      const consent = document.getElementById('custom-consent-check').checked;

      if (!consent) {
        alert(t.alertConsent);
        return;
      }
      if (!itemName || !desc || !contactVal) {
        alert(t.alertCustomFields);
        return;
      }

      const submitBtn = document.getElementById('custom-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = t.customSending;

      const payload = {
        type: 'CUSTOM_ORDER',
        country: currentCountry,
        itemName,
        color,
        description: desc,
        contactType,
        contact: contactVal,
        tgUser: tg?.initDataUnsafe?.user || null
      };

      try {
        await fetch(ORDER_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        if (tg && typeof tg.sendData === 'function') {
          try {
            tg.sendData(JSON.stringify({ type: 'CUSTOM_ORDER', item: itemName, contact: contactVal }));
          } catch(e) {}
        }

        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        document.getElementById('custom-order-modal').classList.remove('active');
        document.getElementById('t-success-title').textContent = t.alertCustomSuccessTitle;
        document.getElementById('t-success-desc').textContent = t.alertCustomSuccess;
        document.getElementById('success-modal').classList.add('active');

        document.getElementById('custom-item-name').value = '';
        document.getElementById('custom-item-color').value = '';
        document.getElementById('custom-item-desc').value = '';
        document.getElementById('custom-contact-value').value = '';
      } catch (err) {
        alert(t.alertOrderError);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = t.customSubmit;
      }
    });

    // Оформление обычного заказа из корзины
    document.getElementById('submit-btn').addEventListener('click', async () => {
      const t = I18N[currentCountry];
      const consent = document.getElementById('cart-consent-check').checked;
      const phone = document.getElementById('customer-phone').value.trim();
      const comment = document.getElementById('customer-comment').value.trim();
      const delivery = document.getElementById('delivery-method').value;
      const payment = document.getElementById('payment-method').value;
      const cep = document.getElementById('customer-cep').value.trim();

      if (!consent) {
        alert(t.alertConsent);
        return;
      }
      if (cart.length === 0) {
        alert(t.emptyCart);
        return;
      }
      if (!phone) {
        alert(t.alertPhone);
        return;
      }
      if (!comment) {
        alert(t.alertAddress);
        return;
      }
      if (currentCountry === 'BR' && !cep) {
        alert(t.alertCep);
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = t.submittingOrderBtn;

      const totalSumRub = cart.reduce((acc, item) => {
        const itemPrice = item.basePrice + (item.engraving ? ENGRAVING_PRICE_RUB : 0);
        return acc + itemPrice * item.qty;
      }, 0);

      const sanitizedItems = cart.map(item => ({
        id: item.id,
        name: item.name,
        qty: item.qty,
        color: item.color,
        engraving: item.engraving,
        engravingText: item.engravingText || ''
      }));

      const payload = {
        type: 'STANDARD_ORDER',
        country: currentCountry,
        currency: currentCurrency,
        total: formatPrice(totalSumRub),
        totalRub: totalSumRub,
        delivery,
        payment,
        phone,
        address: comment,
        cep: currentCountry === 'BR' ? cep : '',
        items: sanitizedItems,
        tgUser: tg?.initDataUnsafe?.user || null
      };

      try {
        await fetch(ORDER_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        if (tg && typeof tg.sendData === 'function') {
          try {
            tg.sendData(JSON.stringify({ type: 'STANDARD_ORDER', total: payload.total, phone: payload.phone }));
          } catch(e) {}
        }

        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        cart = [];
        updateCartUI();
        document.getElementById('cart-modal').classList.remove('active');
        document.getElementById('t-success-title').textContent = t.alertOrderSuccessTitle;
        document.getElementById('t-success-desc').textContent = t.alertOrderSuccess;
        document.getElementById('success-modal').classList.add('active');
      } catch (err) {
        alert(t.alertOrderError);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = t.submitOrderBtn;
      }
    });

    document.getElementById('success-modal-btn').addEventListener('click', () => {
      document.getElementById('success-modal').classList.remove('active');
    });

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-category');
        renderProducts();
      });
    });

    document.getElementById('language-select').addEventListener('change', (e) => {
      changeLanguage(e.target.value);
    });

    document.getElementById('currency-select').addEventListener('change', (e) => {
      currentCurrency = e.target.value;
      renderProducts();
      updateCartUI();
      const t = I18N[currentCountry];
      document.getElementById('item-engraving-label').textContent = `${t.engravingPlus} (+${formatPrice(ENGRAVING_PRICE_RUB)})`;
    });

    document.querySelectorAll('.modal-overlay').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });
    });

    // Запуск приложения: интерфейс рисуется мгновенно, курсы подгружаются параллельно
    window.addEventListener('DOMContentLoaded', () => {
      if (tg) {
        try {
          tg.ready();
          tg.expand();
        } catch(e) {}
      }

      // Сначала гарантированно отрисовываем каталог
      changeLanguage('RU');

      // Затем асинхронно обновляем курсы валют без риска заблокировать страницу
      fetchExchangeRates().then(() => {
        if (currentCurrency !== 'RUB') {
          renderProducts();
          updateCartUI();
        }
      });
    });
  </script>
