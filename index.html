<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kozhedelnikov | Leather Craft</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preload" as="image" href="./images/oblozhkaV1/img1.webp">
  <link rel="preload" as="image" href="./images/Wallet/Cartholder/Black/cartholderM2.webp">
  <link rel="preload" as="image" href="./images/bagmen/bodykos/kos1.webp">

  <script type="module">
    import { init, trackEvent } from 'https://esm.sh/@aptabase/web@0.1.1';
    
    try {
      init('A-US-0220832996', { appVersion: '1.0.0' });
      window.trackAptabaseEvent = trackEvent;

      setTimeout(() => {
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        trackEvent('app_open', {
          user_id: tgUser ? String(tgUser.id) : 'unknown',
          username: tgUser && tgUser.username ? tgUser.username : 'anonymous'
        });
      }, 500);
    } catch (err) {
      console.error('Aptabase error:', err);
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #12100e;
      --card-bg: #1c1815;
      --accent-color: #d4a373;
      --accent-hover: #e0b080;
      --text-main: #fefae0;
      --text-muted: #a39e93;
      --border-color: #332b25;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
      line-height: 1.4;
      width: 100%;
      min-height: 100vh;
    }

    #app-loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg-color); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.25s ease;
    }
    #app-loader.fade-out { opacity: 0; pointer-events: none; }
    .loader-brand { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600; color: var(--accent-color); margin-bottom: 8px; }
    .loader-sub { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border-color); border-top-color: var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    header {
      padding: 20px 16px 12px; background: linear-gradient(180deg, #1c1815 0%, #12100e 100%);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; width: 100%;
    }
    .brand-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; color: var(--accent-color); text-align: center; margin-bottom: 4px; }
    .brand-subtitle { font-size: 11px; color: var(--text-muted); text-align: center; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }

    .top-action-bar { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
    .top-action-bar::-webkit-scrollbar { display: none; }
    .select-pill, .action-btn {
      background: var(--card-bg); color: var(--accent-color); border: 1px solid var(--border-color);
      padding: 6px 11px; border-radius: 12px; font-size: 12px; font-weight: 600; outline: none; cursor: pointer; flex-shrink: 0;
    }

    .categories-wrapper { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .categories-wrapper::-webkit-scrollbar { display: none; }
    .category-btn {
      background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted);
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; flex-shrink: 0;
    }
    .category-btn.active { background: var(--accent-color); color: #12100e; border-color: var(--accent-color); font-weight: 600; }

    .container { padding: 16px; width: 100%; }
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (min-width: 768px) { .container { max-width: 900px; margin: 0 auto; } .products-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 1100px) { .container { max-width: 1100px; } .products-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

    .product-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .product-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background-color: #26201b; cursor: pointer; }
    .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-category-tag { font-size: 10px; text-transform: uppercase; color: var(--accent-color); letter-spacing: 0.8px; margin-bottom: 4px; }
    .product-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 38px; cursor: pointer; }
    .product-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { font-size: 15px; font-weight: 700; color: var(--text-main); margin-top: auto; margin-bottom: 8px; }

    .color-swatches { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; min-height: 20px; }
    .color-dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); cursor: pointer; opacity: 0.75; }
    .color-dot.active { transform: scale(1.25); opacity: 1; border-color: rgba(255, 255, 255, 0.9); }

    .add-btn { background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; }

    .cart-bar {
      position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 600px; margin: 0 auto;
      background: var(--accent-color); color: #12100e; padding: 14px 20px; border-radius: 30px;
      display: flex; justify-content: space-between; align-items: center; font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); cursor: pointer; z-index: 200; transform: translateY(100px); opacity: 0; transition: all 0.3s ease;
    }
    .cart-bar.visible { transform: translateY(0); opacity: 1; }
    .cart-count-badge { background: #12100e; color: var(--accent-color); padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 8px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px); z-index: 300; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 600px; max-height: 85vh; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px; overflow-y: auto; border: 1px solid var(--border-color); transform: translateY(100%); transition: transform 0.3s ease; }
    .modal-overlay.active .modal-content { transform: translateY(0); }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent-color); }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

    .form-group { margin-top: 14px; }
    .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-size: 13px; outline: none; font-family: inherit; }
    
    .checkout-btn { background: var(--accent-color); color: #12100e; width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 15px; margin-top: 20px; cursor: pointer; }

    /* Маркетинговый блок помощи в корзине */
    .cart-help-banner {
      background: rgba(212, 163, 115, 0.08); border: 1px dashed var(--accent-color);
      border-radius: 12px; padding: 12px; margin-bottom: 14px; text-align: center;
    }
    .cart-help-banner p { font-size: 12px; color: var(--text-main); margin-bottom: 8px; line-height: 1.4; }
    .cart-help-btn {
      display: inline-block; background: var(--accent-color); color: #12100e;
      text-decoration: none; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px;
    }
  </style>
</head>
<body>

  <div id="app-loader">
    <div class="loader-brand">KOZHEDELNIKOV</div>
    <div class="loader-sub">Leather Craft</div>
    <div class="spinner"></div>
  </div>

  <header>
    <div class="brand-title">KOZHEDELNIKOV</div>
    <div class="brand-subtitle" id="t-brand-sub">Leather Craft & Accessories</div>

    <div class="top-action-bar">
      <select class="select-pill" id="language-select">
        <option value="US">🇺🇸 US</option>
        <option value="RU">🇷🇺 RU</option>
        <option value="BR">🇧🇷 BR</option>
      </select>

      <select class="select-pill" id="currency-select">
        <option value="USD">$ (USD)</option>
        <option value="RUB">₽ (RUB)</option>
        <option value="BRL">R$ (BRL)</option>
      </select>

      <button class="action-btn" id="header-custom-order-btn"><span id="t-btn-custom">Эксклюзив</span></button>
      <button class="action-btn" id="header-about-btn"><span id="t-btn-about">О нас</span></button>
    </div>

    <div class="categories-wrapper">
      <button class="category-btn active" data-category="all" id="t-cat-all">Все товары</button>
      <button class="category-btn" data-category="wallets" id="t-cat-wallets">Кошельки</button>
      <button class="category-btn" data-category="bags" id="t-cat-bags">Сумки</button>
      <button class="category-btn" data-category="accessories" id="t-cat-accessories">Аксессуары</button>
      <button class="category-btn" data-category="adult" id="t-cat-adult">18+</button>
    </div>
  </header>

  <div class="container">
    <div class="products-grid" id="products-grid"></div>
  </div>

  <div class="cart-bar" id="cart-bar">
    <div>
      <span id="t-cart-label">Корзина</span>
      <span class="cart-count-badge" id="cart-count">0</span>
    </div>
    <div id="cart-total">0 ₽</div>
  </div>

  <!-- Modal: Cart & Delivery & Payment -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="t-cart-modal-title">Ваш заказ</div>
        <button class="close-btn" id="close-cart-btn">&times;</button>
      </div>

      <!-- Маркетинговая подсказка в корзине для борьбы с брошенными заказами -->
      <div class="cart-help-banner">
        <p id="t-cart-help-text">Возникли вопросы по оформлению, доставке или оплате? Напишите мастеру и получите персональный бонус!</p>
        <a href="https://t.sch/kozjedelnikov" target="_blank" class="cart-help-btn" id="t-cart-help-btn">💬 Написать мастеру в Telegram</a>
      </div>

      <div id="cart-items-container"></div>

      <div class="form-group">
        <label class="form-label" id="t-cart-delivery-lbl">Способ доставки:*</label>
        <select class="form-select" id="delivery-method"></select>
      </div>

      <div class="form-group">
        <label class="form-label" id="t-cart-payment-lbl">Способ оплаты:*</label>
        <select class="form-select" id="payment-method"></select>
      </div>

      <div class="form-group" id="group-customer-cep" style="display: none;">
        <label class="form-label" id="t-cart-cep-lbl">CEP (Código Postal):*</label>
        <input type="text" class="form-input" id="customer-cep" placeholder="00000-000" maxlength="9">
      </div>

      <div class="form-group">
        <label class="form-label" id="t-cart-phone-lbl">Номер телефона для связи:*</label>
        <input type="tel" class="form-input" id="customer-phone" placeholder="+7 (999) 000-00-00">
      </div>

      <div class="form-group">
        <label class="form-label" id="t-cart-comment-lbl">Адрес / Комментарий к заказу:*</label>
        <input type="text" class="form-input" id="customer-comment" placeholder="Город, адрес ПВЗ или пожелания">
      </div>

      <button class="checkout-btn" id="submit-btn">Оформить заказ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const ORDER_API_URL = "https://script.google.com/macros/s/AKfycbw7_bYZwaNw24Vy2vOTiF20VMP3VYc-744kklMwm6uHhhZJ8BoFVOBnXL7ObwhfApqm-g/exec";

    const I18N = {
      RU: {
        htmlLang: 'ru-RU', brandSub: 'Авторские изделия ручной работы',
        cartLabel: 'Корзина', chooseBtn: 'Выбрать и заказать', emptyCart: 'Корзина пуста',
        cartHelpText: 'Возникли вопросы по доставке или оплате? Напишите мастеру и получите скидку!',
        cartHelpBtn: '💬 Написать в Telegram',
        deliveryOptions: [
          { val: 'Авиадоставка из Бразилии', text: '✈️ Авиадоставка из Бразилии' },
          { val: 'СДЭК по РФ', text: '📦 СДЭК по РФ' },
          { val: 'Самовывоз / Курьер (Флорианополис, Бразилия)', text: '📍 Самовывоз (Флорианополис)' }
        ],
        paymentOptions: [
          { val: 'СБП (Перевод на карту РФ / Озон)', text: '💳 СБП (Карта РФ / Озон банк)' },
          { val: 'PIX (Для живущих в Бразилии)', text: '🇧🇷 PIX (Мгновенно в реаалах)' },
          { val: 'Bybit UID (USDT 0%)', text: '🪙 Криптоперевод по Bybit UID (USDT 0%)' },
          { val: 'Криптовалюта (USDT TRC-20 / TON)', text: '💎 USDT (TRC-20) / TON' }
        ]
      },
      US: {
        htmlLang: 'en-US', brandSub: 'Handcrafted in Brazil | Worldwide Shipping',
        cartLabel: 'Cart', chooseBtn: 'Select & Order', emptyCart: 'Cart is empty',
        cartHelpText: 'Have questions about shipping or payment? Message the artisan and get a special bonus!',
        cartHelpBtn: '💬 Message on Telegram',
        deliveryOptions: [
          { val: 'Standard Worldwide Tracked', text: '📦 Standard Worldwide Tracked — FREE' },
          { val: 'Express Priority Courier', text: '⚡ Express Priority Courier' }
        ],
        paymentOptions: [
          { val: 'Bybit UID (USDT 0% fee)', text: '🪙 Crypto Transfer via Bybit UID (USDT 0%)' },
          { val: 'Crypto Wallet (USDT TRC-20 / TON)', text: '💎 Crypto (USDT TRC-20 / TON)' }
        ]
      },
      BR: {
        htmlLang: 'pt-BR', brandSub: 'Ateliê de Couro Artesanal | Brasil',
        cartLabel: 'Carrinho', chooseBtn: 'Escolher e Pedir', emptyCart: 'O carrinho está vazio',
        cartHelpText: 'Dúvidas sobre o frete ou pagamento? Fale com o artesão e ganhe um desconto exclusivo!',
        cartHelpBtn: '💬 Falar no Telegram',
        deliveryOptions: [
          { val: 'Correios / Frete Padrão Brasil', text: '📦 Correios — Frete Padrão com Rastreio' },
          { val: 'Retirada em Florianópolis (Centro/Lagoa)', text: '📍 Retirada em mãos (Florianópolis)' }
        ],
        paymentOptions: [
          { val: 'PIX (Chave Instantânea)', text: '⚡ PIX Instantâneo (R$)' },
          { val: 'Bybit UID / Cripto (USDT)', text: '🪙 Cripto / Transferência Bybit UID (USDT)' }
        ]
      }
    };

    let currentCountry = 'RU';
    let currentCurrency = 'USD';
    let exchangeRates = { RUB: 1, USD: 0.011, BRL: 0.058 };
    let cart = [];

    function formatPrice(rubPrice) {
      if (currentCurrency === 'USD') return `$${(rubPrice * exchangeRates.USD).toFixed(0)}`;
      if (currentCurrency === 'BRL') return `R$ ${(rubPrice * exchangeRates.BRL).toFixed(0)}`;
      return `${rubPrice.toLocaleString()} ₽`;
    }

    function setLanguage(countryCode) {
      currentCountry = countryCode;
      const t = I18N[countryCode] || I18N.RU;

      document.getElementById('t-cart-help-text').textContent = t.cartHelpText;
      document.getElementById('t-cart-help-btn').textContent = t.cartHelpBtn;
      document.getElementById('delivery-method').innerHTML = t.deliveryOptions.map(o => `<option value="${o.val}">${o.text}</option>`).join('');
      document.getElementById('payment-method').innerHTML = t.paymentOptions.map(o => `<option value="${o.val}">${o.text}</option>`).join('');
      
      const cepGroup = document.getElementById('group-customer-cep');
      cepGroup.style.display = (countryCode === 'BR') ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      setLanguage('RU');
      const loader = document.getElementById('app-loader');
      if (loader) { loader.classList.add('fade-out'); setTimeout(() => loader.remove(), 250); }
    });
  </script>
</body>
</html>
